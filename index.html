  var form = document.getElementById('form');
  var input = document.getElementById('key');
  var err = document.getElementById('err');
  var unlocked = false;

  function bytes(b64) {
    var s = atob(b64), out = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }

  function unlock(key) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(key), 'PBKDF2', false, ['deriveKey'])
      .then(function (material) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: bytes(PAYLOAD.s), iterations: PAYLOAD.i, hash: 'SHA-256' },
          material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (aesKey) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(PAYLOAD.v) }, aesKey, bytes(PAYLOAD.c));
      })
      .then(function (plain) {
        show(new TextDecoder().decode(plain));
      });
  }

  // Swap the decrypted page in as ordinary DOM. (document.write would also
  // work, but browsers, Firefox especially, run such documents more slowly.)
  function show(html) {
    unlocked = true;
    window.removeEventListener('hashchange', tryLink);
    var page = new DOMParser().parseFromString(html, 'text/html');
    document.documentElement.lang = page.documentElement.lang;
    document.title = page.title;

    var head = document.head;
    while (head.firstChild) head.removeChild(head.firstChild);
    Array.prototype.forEach.call(page.head.childNodes, function (node) {
      head.appendChild(document.importNode(node, true));
    });
    var robots = document.createElement('meta');
    robots.name = 'robots';
    robots.content = 'noindex, nofollow';
    head.appendChild(robots);

    var body = document.importNode(page.body, true);
    // Scripts from a parsed document don't run when inserted, so recreate them.
    Array.prototype.forEach.call(body.querySelectorAll('script'), function (old) {
      var s = document.createElement('script');
      s.textContent = old.textContent;
      old.parentNode.replaceChild(s, old);
    });
    document.body.replaceWith(body);
  }

  function askForKey(message) {
    form.hidden = false;
    err.textContent = message || '';
    input.focus();
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var key = input.value.trim().replace(/^.*#k=/, '');
    unlock(key).then(function () {
      // Keep the key in the address bar so a refresh stays unlocked.
      history.replaceState(null, '', '#k=' + encodeURIComponent(key));
    }, function () {
      askForKey('That key doesn’t open this page.');
      input.select();
    });
  });

  function tryLink() {
    if (unlocked) return true;
    var match = /[#&]k=([^&]+)/.exec(location.hash);
    if (!match) return false;
    unlock(decodeURIComponent(match[1])).catch(function () {
      askForKey('The key in this link doesn’t open the page.');
    });
    return true;
  }

  if (!window.crypto || !crypto.subtle) {
    askForKey('This browser can’t open the page. Please try a recent Chrome, Firefox, Edge or Safari.');
  } else {
    // Pasting the full link into the address bar while this page is open only
    // changes the "#" part, which doesn't reload the page.
    window.addEventListener('hashchange', tryLink);
    if (!tryLink()) askForKey();
  }
